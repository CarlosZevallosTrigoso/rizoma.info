<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>rizoma.cursos</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <a class="skip-link" href="#content">Saltar al contenido</a>

  <div id="app">
    <div id="mobilebar">
      <button id="menu-toggle" aria-expanded="false" aria-controls="sidebar" aria-label="Abrir navegación">☰</button>
      <span class="brand">Rizoma</span>
    </div>

    <aside id="sidebar" aria-label="Navegación principal">
      <div class="brand"><a href="#/">Rizoma</a></div>
      <nav id="nav">
        <div class="nav-info">
          <a href="#/info" id="link-info">Info</a>
        </div>
        <div class="nav-section" id="section-cursos">
          <button type="button" aria-expanded="false">
            <span>Cursos/talleres</span><span class="chev">›</span>
          </button>
          <ul class="items" id="list-cursos"></ul>
        </div>
        <div class="nav-section" id="section-pasados">
          <button type="button" aria-expanded="false">
            <span>Pasados</span><span class="chev">›</span>
          </button>
          <ul class="items" id="list-pasados"></ul>
        </div>
      </nav>
    </aside>

    <div id="main">
      <div id="content-wrap">
        <main id="content" tabindex="-1">
          <p class="state">Cargando…</p>
        </main>
      </div>
    </div>
  </div>

<script src="vendor/marked.js"></script>
<script>
/* ============================================================
 * NÚCLEO PURO — sin DOM, sin fetch. Verificado con core.test.js
 * antes de inyectarse aquí byte-idéntico.
 * ============================================================ */
'use strict';
// parsea el hash de la URL a una ruta estructurada.
// formatos válidos: '', '#', '#/', '#/info', '#/cursos/<slug>', '#/pasados/<slug>'
function parseHash(hash) {
  const clean = String(hash || '').replace(/^#/, '').replace(/^\/+/, '').replace(/\/+$/, '');
  if (clean === '' || clean === 'info') return { type: 'info' };

  const parts = clean.split('/').filter(Boolean);
  if (parts.length === 2 && parts[0] === 'cursos') {
    return { type: 'curso', slug: decodeURIComponent(parts[1]) };
  }
  if (parts.length === 2 && parts[0] === 'pasados') {
    return { type: 'pasado', slug: decodeURIComponent(parts[1]) };
  }
  return { type: 'notfound' };
}

// resuelve una ruta contra el índice cargado; devuelve {titulo, path} o null.
function resolveEntry(route, indice) {
  if (!indice) return null;

  if (route.type === 'info') {
    if (!indice.info || !indice.info.archivo) return null;
    return { titulo: indice.info.titulo || 'Info', path: 'contenido/' + indice.info.archivo };
  }

  if (route.type === 'curso') {
    const list = Array.isArray(indice.cursos) ? indice.cursos : [];
    const found = list.find((c) => c.slug === route.slug);
    if (!found) return null;
    return { titulo: found.titulo || found.slug, path: 'contenido/' + found.archivo };
  }

  if (route.type === 'pasado') {
    const list = Array.isArray(indice.pasados) ? indice.pasados : [];
    const found = list.find((c) => c.slug === route.slug);
    if (!found) return null;
    return { titulo: found.titulo || found.slug, path: 'contenido/' + found.archivo };
  }

  return null;
}

// arma la estructura del sidebar a partir del índice (sin tocar DOM).
// devuelve un árbol simple que la capa de render recorre.
function buildSidebarModel(indice) {
  const cursos = Array.isArray(indice && indice.cursos) ? indice.cursos : [];
  const pasados = Array.isArray(indice && indice.pasados) ? indice.pasados : [];
  return {
    info: { titulo: (indice && indice.info && indice.info.titulo) || 'Info', href: '#/info' },
    cursos: cursos.map((c) => ({ titulo: c.titulo || c.slug, href: '#/cursos/' + c.slug })),
    pasados: pasados.map((c) => ({ titulo: c.titulo || c.slug, href: '#/pasados/' + c.slug })),
  };
}
/* ============================================================
 * FIN DEL NÚCLEO PURO
 * ============================================================ */

/* === CAPA DOM === */
(function () {
  'use strict';
  const $ = (id) => document.getElementById(id);
  const contentEl = $('content');
  const sidebarEl = $('sidebar');
  const menuToggle = $('menu-toggle');

  let indiceData = null;

  // ---------- carga del índice ----------
  function init() {
    fetch('contenido/indice.json', { cache: 'no-cache' })
      .then((res) => {
        if (!res.ok) throw new Error('HTTP ' + res.status);
        return res.json();
      })
      .then((json) => {
        indiceData = json;
        renderSidebar(buildSidebarModel(indiceData));
        router();
      })
      .catch((err) => {
        renderIndiceError(err);
      });
  }

  function renderIndiceError(err) {
    contentEl.innerHTML =
      '<p class="state error">No se pudo cargar <code>contenido/indice.json</code>.</p>' +
      '<p class="state">Si estás probando localmente, recuerda que <code>fetch()</code> no funciona ' +
      'abriendo el archivo directamente (<code>file://</code>); sirve la carpeta con un servidor local, ' +
      'por ejemplo <code>python3 -m http.server</code>, y abre <code>http://localhost:8000</code>.</p>' +
      '<p class="state path">' + escapeHtml(String(err && err.message || err)) + '</p>';
  }

  // ---------- sidebar ----------
  function renderSidebar(model) {
    $('link-info').href = model.info.href;
    $('link-info').textContent = model.info.titulo;
    renderList($('list-cursos'), model.cursos, 'Sin cursos publicados aún.');
    renderList($('list-pasados'), model.pasados, 'En construcción...');
  }

  function renderList(ulEl, items, emptyMsg) {
    ulEl.innerHTML = '';
    if (!items.length) {
      const li = document.createElement('li');
      li.className = 'empty';
      li.textContent = emptyMsg;
      ulEl.appendChild(li);
      return;
    }
    items.forEach((item) => {
      const li = document.createElement('li');
      const a = document.createElement('a');
      a.href = item.href;
      a.textContent = item.titulo;
      li.appendChild(a);
      ulEl.appendChild(li);
    });
  }

  // toggles de sección (cursos / pasados)
  ['section-cursos', 'section-pasados'].forEach((id) => {
    const section = $(id);
    const btn = section.querySelector('button');
    btn.addEventListener('click', () => {
      const open = section.classList.toggle('open');
      btn.setAttribute('aria-expanded', String(open));
    });
  });

  function setActiveLink(route) {
    document.querySelectorAll('#nav a').forEach((a) => a.classList.remove('active'));
    if (route.type === 'info') {
      $('link-info').classList.add('active');
    } else if (route.type === 'curso') {
      const href = '#/cursos/' + route.slug;
      const a = document.querySelector('#list-cursos a[href="' + cssEscape(href) + '"]');
      if (a) a.classList.add('active');
      openSection('section-cursos');
    } else if (route.type === 'pasado') {
      const href = '#/pasados/' + route.slug;
      const a = document.querySelector('#list-pasados a[href="' + cssEscape(href) + '"]');
      if (a) a.classList.add('active');
      openSection('section-pasados');
    }
  }

  function openSection(id) {
    const section = $(id);
    if (!section.classList.contains('open')) {
      section.classList.add('open');
      section.querySelector('button').setAttribute('aria-expanded', 'true');
    }
  }

  function cssEscape(s) {
    return s.replace(/["\\]/g, '\\$&');
  }

  // ---------- router ----------
  function router() {
    if (!indiceData) return;
    const route = parseHash(location.hash);

    if (route.type === 'notfound') {
      render404();
      setActiveLink(route);
      closeMobileMenu();
      return;
    }

    const entry = resolveEntry(route, indiceData);
    if (!entry) {
      render404();
      setActiveLink(route);
      closeMobileMenu();
      return;
    }

    setActiveLink(route);
    loadMarkdown(entry);
    closeMobileMenu();
  }

  function render404() {
    contentEl.innerHTML =
      '<p class="state error">Página no encontrada.</p>' +
      '<p class="state"><a href="#/info">Volver a Info</a></p>';
    contentEl.focus();
  }

  function loadMarkdown(entry) {
    contentEl.innerHTML = '<p class="state">Cargando…</p>';
    fetch(entry.path, { cache: 'no-cache' })
      .then((res) => {
        if (!res.ok) throw new Error('HTTP ' + res.status);
        return res.text();
      })
      .then((md) => {
        contentEl.innerHTML = marked.parse(md);
        document.title = entry.titulo + ' · rizoma.cursos';
        contentEl.focus();
      })
      .catch((err) => {
        contentEl.innerHTML =
          '<p class="state error">No se pudo cargar el contenido de «' + escapeHtml(entry.titulo) + '».</p>' +
          '<p class="state path">Se esperaba el archivo: <code>' + escapeHtml(entry.path) + '</code></p>' +
          '<p class="state">' + escapeHtml(String(err && err.message || err)) + '</p>';
      });
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, (c) => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
    }[c]));
  }

  // ---------- menú móvil ----------
  function openMobileMenu() {
    sidebarEl.classList.add('open');
    menuToggle.setAttribute('aria-expanded', 'true');
  }
  function closeMobileMenu() {
    sidebarEl.classList.remove('open');
    menuToggle.setAttribute('aria-expanded', 'false');
  }
  menuToggle.addEventListener('click', () => {
    sidebarEl.classList.contains('open') ? closeMobileMenu() : openMobileMenu();
  });

  window.addEventListener('hashchange', router);
  init();
})();
</script>
</body>
</html>
